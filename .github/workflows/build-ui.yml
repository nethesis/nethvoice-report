name: Build UI

on:
  push:
    branches:
      - ns8
    paths:
      - 'ui/**'
      - '.github/workflows/build-ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/build-ui.yml'

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      # Keep the Node version in sync with the node_build stage of
      # ns8-nethvoice/reports/Containerfile, which is what ships to NS8.
      - uses: actions/setup-node@v7
        with:
          node-version: '14.21.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
